name: Windows preview release
on:
  push:
    branches: [main, codex/fix-preview-release]
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1 -Publish
      - name: Package
        shell: pwsh
        run: ./scripts/Package.ps1
      - name: Publish preview
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @packages --verify-tag --prerelease --title "IsLet-Todo $env:GITHUB_REF_NAME" --notes-file docs/PREVIEW-RELEASE.md
          if ($LASTEXITCODE) { throw 'Preview release upload failed' }
